services:
  postgres:
    image: postgres:16
    container_name: jwt-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jwt-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  postgres_data: